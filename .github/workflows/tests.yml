name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '25', '27']

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install Apache Ant 1.10.18
        shell: bash
        env:
          ANT_VERSION: '1.10.18'
          ANT_SHA512: c510d744876d8da48dabc9495b023b6ec5284a0f18b40ee50d98ce099e791ca5c73e3cd4c80d3c90d3efc03f9620be43aad0a373ed47198284f7e3373e0db2c3
        run: |
          for ant_source in \
            "https://dlcdn.apache.org/ant/binaries" \
            "https://archive.apache.org/dist/ant/binaries"; do
            if curl --fail --silent --show-error --location --retry 1 \
              --connect-timeout 15 --max-time 90 \
              "$ant_source/apache-ant-${ANT_VERSION}-bin.tar.gz" \
              --output "$RUNNER_TEMP/ant.tar.gz" \
              && printf '%s  %s\n' "$ANT_SHA512" "$RUNNER_TEMP/ant.tar.gz" | sha512sum --check; then
              break
            fi
            rm -f "$RUNNER_TEMP/ant.tar.gz"
          done
          if [ ! -f "$RUNNER_TEMP/ant.tar.gz" ]; then
            echo "::error::Could not download a verified Apache Ant ${ANT_VERSION} archive"
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/ant.tar.gz" -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/apache-ant-${ANT_VERSION}/lib/ant-junitlauncher.jar"
          echo "ANT_HOME=$RUNNER_TEMP/apache-ant-${ANT_VERSION}" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/apache-ant-${ANT_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          java -version
          ant -version

      - name: Build and run all tests
        run: ant -noinput -f build-tests.xml clean Test

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-java-${{ matrix.java }}
          path: test-build/reports/
          if-no-files-found: warn
          retention-days: 14
