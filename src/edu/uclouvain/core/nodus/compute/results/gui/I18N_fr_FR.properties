PerformanceDlg.tooltip.Coverage=Couverture des quantit\u00e9s OD, d\u00e9ficits, exc\u00e9dents et cellules observ\u00e9es positives sans flux affect\u00e9.
PerformanceDlg.ComparisonScope=La comparaison porte sur les modes s\u00e9lectionn\u00e9s. Les chemins, lignes OD multiples, classes et heures de d\u00e9part sont somm\u00e9s par mode, groupe de marchandises, origine et destination. Les cellules couvrent tous les modes s\u00e9lectionn\u00e9s pour l\u2019union des OD observ\u00e9es et affect\u00e9es.
