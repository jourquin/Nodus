PerformanceDlg.ExtraODs=OD uniquement affect\u00e9es
PerformanceDlg.ZeroCells=Cellules observ\u00e9es positives / affect\u00e9es nulles
PerformanceDlg.ZeroQuantity=Quantit\u00e9 observ\u00e9e dans ces cellules
PerformanceDlg.CoverageNotes=La couverture compare l\u2019affectation aux matrices de r\u00e9f\u00e9rence, pas \u00e0 sa demande initiale. Elle ne donne pas le taux de demande non affect\u00e9e si ces totaux diff\u00e8rent. D\u00e9ficits et exc\u00e9dents somment s\u00e9par\u00e9ment les diff\u00e9rences positives des totaux OD. La couverture signifie qu\u2019un flux affect\u00e9 existe sur l\u2019OD ; les d\u00e9ficits partiels apparaissent dans la colonne d\u00e9ficit.
PerformanceDlg.ValidationNotes=La validation pr\u00e9dictive exige des OD ou p\u00e9riodes non utilis\u00e9es pour estimer les param\u00e8tres ou calibrer les pivots. Les pond\u00e9rations en tonnes sont descriptives ; les tonnes ne sont pas des choix ind\u00e9pendants.
PerformanceDlg.Undefined=Ind\u00e9fini
PerformanceDlg.ZeroShareODs=OD admissibles concern\u00e9es
PerformanceDlg.ZeroShareCells=Cellules modales concern\u00e9es
PerformanceDlg.ZeroShareQuantity=Quantit\u00e9 observ\u00e9e dans ces cellules
PerformanceDlg.ZeroShareExamples=Au plus 20 cellules concern\u00e9es ayant les plus grandes quantit\u00e9s observ\u00e9es :
PerformanceDlg.Origin=Origine
PerformanceDlg.Destination=Destination
PerformanceDlg.AssignedODTotal=Total OD affect\u00e9
PerformanceDlg.StoredZeroNotes=Une quantit\u00e9 affect\u00e9e enregistr\u00e9e peut \u00eatre nulle \u00e0 cause d\u2019un mode indisponible, des r\u00e8gles d\u2019affectation ou de l\u2019arrondi de petits flux. Ces scores comparent les quantit\u00e9s enregistr\u00e9es, pas les probabilit\u00e9s internes du mod\u00e8le. Aucun lissage ni seuil minimal de probabilit\u00e9 n\u2019est appliqu\u00e9.
PerformanceDlg.JS=Divergence de Jensen\u2013Shannon
PerformanceDlg.tooltip.JS=Divergence de Jensen\u2013Shannon pond\u00e9r\u00e9e par les quantit\u00e9s observ\u00e9es, avec logarithmes en base 2. Va de 0 (parts identiques) \u00e0 1 (parts disjointes) et accepte les parts nulles.
PerformanceDlg.ShareNotes=Les scores de r\u00e9partition modale exigent des totaux OD observ\u00e9s et affect\u00e9s positifs. Les OD sans affectation sont exclues des scores et signal\u00e9es s\u00e9par\u00e9ment ci-dessous. L\u2019erreur OD vaut la moiti\u00e9 de la somme des \u00e9carts absolus entre parts (0 \u00e0 100 %). M\u00e9diane/P90 donnent le m\u00eame poids \u00e0 chaque OD/groupe admissible. Entropie crois\u00e9e et divergence de Jensen\u2013Shannon sont pond\u00e9r\u00e9es par les quantit\u00e9s observ\u00e9es ; plus petit est meilleur. Jensen\u2013Shannon utilise les logarithmes en base 2 et va de 0 (parts identiques) \u00e0 1 (parts disjointes) ; les parts nulles sont valides. L\u2019entropie crois\u00e9e utilise les logarithmes naturels, peut \u00eatre infinie pour une cellule observ\u00e9e positive de part pr\u00e9dite nulle et ne vaut pas n\u00e9cessairement z\u00e9ro pour des parts identiques.
PerformanceDlg.InfiniteScores=Pourquoi l\u2019entropie crois\u00e9e est infinie
PerformanceDlg.InfiniteScoreNotes=Un seul mode observ\u00e9 positif sans flux affect\u00e9 rend l\u2019entropie crois\u00e9e infinie pour tout le groupe. Les OD admissibles ont des totaux positifs des deux c\u00f4t\u00e9s ; cela n\u2019exige pas un flux affect\u00e9 pour chaque mode observ\u00e9. Les d\u00e9comptes ci-dessous portent uniquement sur ces OD admissibles. Un score infini ne signifie pas que toutes les OD sont mal pr\u00e9dites.
