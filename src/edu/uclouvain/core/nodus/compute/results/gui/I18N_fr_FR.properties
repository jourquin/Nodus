PerformanceDlg.Group=Groupe de marchandises
PerformanceDlg.Mode=Mode
PerformanceDlg.VolumeNotes=Le WAPE et le biais relatif utilisent la quantit\u00e9 observ\u00e9e totale comme d\u00e9nominateur ; ils sont ind\u00e9finis si elle est nulle. Un biais positif indique une surestimation. Le RMSE est exprim\u00e9 en unit\u00e9s de quantit\u00e9. Comparer les mod\u00e8les sur les m\u00eames matrices, modes et OD.
