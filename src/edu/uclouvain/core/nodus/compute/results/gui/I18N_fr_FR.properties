PerformanceDlg.ObservedODs=OD observ\u00e9es
PerformanceDlg.Covered=Quantit\u00e9 observ\u00e9e sur OD avec affectation (%)
PerformanceDlg.MissingODsShort=OD sans affectation
PerformanceDlg.Shortfall=D\u00e9ficit de quantit\u00e9 OD
