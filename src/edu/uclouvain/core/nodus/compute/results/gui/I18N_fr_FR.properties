PerformanceDlg.tooltip.pathHeaders=Choisir une affectation enregistr\u00e9e. Les chemins sont somm\u00e9s par mode, groupe et paire OD.
PerformanceDlg.tooltip.compute=Comparer les matrices choisies et afficher les indicateurs s\u00e9lectionn\u00e9s.
PerformanceDlg.tooltip.WAPE=100 fois la somme des erreurs absolues divis\u00e9e par la quantit\u00e9 observ\u00e9e.
