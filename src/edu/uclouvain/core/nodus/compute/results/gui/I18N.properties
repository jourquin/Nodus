PerformanceDlg.Covered=Observed quantity on ODs with assigned flow (%)
PerformanceDlg.MissingODsShort=ODs without assigned flow
PerformanceDlg.Shortfall=OD quantity shortfall
PerformanceDlg.Excess=OD quantity excess
PerformanceDlg.ExtraODs=Assigned-only ODs
PerformanceDlg.ZeroCells=Observed-positive / assigned-zero cells
PerformanceDlg.ZeroQuantity=Observed quantity in these cells
PerformanceDlg.CoverageNotes=Coverage compares assignment with the reference matrices, not with its original input demand. It does not establish the assignment's unassigned-demand rate when those totals differ. Shortfall/excess sum positive OD total differences separately. Coverage means some assigned flow exists on the OD; partial shortfalls are shown in the shortfall column.
PerformanceDlg.ValidationNotes=Predictive validation requires ODs or periods not used for parameter estimation or pivot calibration. Tonnage weights are descriptive; tonnes are not independent choices.
PerformanceDlg.Undefined=Undefined
PerformanceDlg.ZeroShareODs=Affected eligible ODs
PerformanceDlg.ZeroShareCells=Affected modal cells
PerformanceDlg.ZeroShareQuantity=Observed quantity in affected cells
PerformanceDlg.ZeroShareExamples=Up to 20 affected modal cells with the largest observed quantities:
PerformanceDlg.Origin=Origin
PerformanceDlg.Destination=Destination
PerformanceDlg.AssignedODTotal=Assigned OD total
PerformanceDlg.StoredZeroNotes=Stored assignment quantities can be zero because of unavailable modes, assignment rules or rounding of small flows. These scores compare saved quantities, not the model's internal probabilities. No smoothing or probability floor is applied.
PerformanceDlg.JS=Jensen\u2013Shannon divergence
PerformanceDlg.tooltip.JS=Observed-quantity-weighted Jensen\u2013Shannon divergence using base-2 logarithms. Ranges from 0 (matching shares) to 1 (disjoint shares), and handles zero shares.
PerformanceDlg.ShareNotes=Modal distribution scores require positive observed and assigned OD totals. Missing assigned ODs are excluded from these scores and reported separately below. OD share error is half the sum of absolute modal-share differences (0 to 100%). Median/P90 give equal weight to each eligible OD/group. Cross-entropy and Jensen\u2013Shannon divergence use observed quantities as weights; lower is better. Jensen\u2013Shannon uses base-2 logarithms and ranges from 0 (matching shares) to 1 (disjoint shares); zero shares are valid. Cross-entropy uses natural logarithms, can be infinite for an observed-positive modal cell with zero predicted share, and need not be zero for matching shares.
PerformanceDlg.InfiniteScores=Why cross-entropy is infinite
PerformanceDlg.InfiniteScoreNotes=One observed-positive mode with zero assigned flow makes the whole group's cross-entropy infinite. Eligible ODs have positive total flow on both sides; this does not require every observed mode to have assigned flow. The counts below concern these eligible ODs only. An infinite group score does not mean that every OD is poorly predicted.
