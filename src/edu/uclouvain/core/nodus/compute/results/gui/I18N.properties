PerformanceDlg.tooltip.pathHeaders=Choose a saved assignment path-header table. All paths are summed by mode, group and OD.
PerformanceDlg.tooltip.compute=Compare the selected matrices and display the selected indicators.
PerformanceDlg.tooltip.WAPE=100 times total absolute error divided by observed quantity.
PerformanceDlg.tooltip.Bias=Signed quantity error relative to observed quantity; positive means overprediction.
PerformanceDlg.tooltip.RMSE=Root mean squared cell error, in quantity units; larger errors receive more weight.
PerformanceDlg.tooltip.ModalShares=Observed and assigned modal shares and their difference in percentage points.
PerformanceDlg.tooltip.ODShareError=Median and 90th percentile of OD modal-share distance; every eligible OD has equal weight.
PerformanceDlg.tooltip.CrossEntropy=Observed-quantity-weighted negative log predicted modal share; lower is better.
PerformanceDlg.tooltip.Coverage=OD quantity coverage, shortfalls, excesses and observed-positive cells with no assigned flow.
PerformanceDlg.ComparisonScope=Comparison is limited to the selected modes. Paths, duplicate matrix rows, classes and departure times are summed by mode, commodity group, origin and destination. Cells use the complete selected-mode grid over the union of observed and assigned ODs.
