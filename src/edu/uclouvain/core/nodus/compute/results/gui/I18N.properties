PerformanceDlg.Mode=Mode
PerformanceDlg.VolumeNotes=WAPE and relative bias use total observed quantity as denominator; they are undefined when it is zero. Positive bias means overprediction. RMSE is in quantity units. Use the same matrices, modes and evaluation ODs when comparing models.
PerformanceDlg.ObservedShare=Observed share (%)
PerformanceDlg.AssignedShare=Assigned share (%)
PerformanceDlg.ShareDifference=Difference (percentage points)
PerformanceDlg.ModalDistribution=OD modal distributions
PerformanceDlg.EligibleODs=Eligible ODs
PerformanceDlg.MedianOD=Median share error (%)
PerformanceDlg.P90OD=P90 share error (%)
PerformanceDlg.MissingODs=Observed ODs without assigned flow:
PerformanceDlg.MissingQuantity=observed quantity:
