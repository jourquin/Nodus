# Modal-choice dialog tooltips
ModalChoiceEstimationDlg.tooltip.method=Choose the modal model to estimate: logit, probit or proportional cost factors.
ModalChoiceEstimationDlg.tooltip.costFile=<html>Choose the existing file supplying transport costs and the basis of the output.<br>Base and commodity/class definitions apply; numbered scenario overrides are ignored.</html>
ModalChoiceEstimationDlg.tooltip.routing=<html>Compute modal costs with fast Dijkstra or exact A-star routing.<br>Both use one search per mode/means, without cost markup.</html>
ModalChoiceEstimationDlg.tooltip.detour=<html>Maximum route length as a multiple of the least-cost reference route's length.<br>Set 0 to disable the detour limit.</html>
ModalChoiceEstimationDlg.tooltip.threads=<html>Set the number of workers used to compute route costs.<br>Parameter fitting runs sequentially.</html>
ModalChoiceEstimationDlg.tooltip.cancel=Close the dialog without estimating or saving changes.
ModalChoiceEstimationDlg.tooltip.estimate=<html>Compute modal costs, estimate parameters and save them in the output cost file.<br>Assignment remains a separate operation.</html>
LogitCalibrationPanel.tooltip.table=<html>Match each network mode ID to its observed OD table.<br>Tables supply grp, org, dst and qty; class is optional.<br>These observations are used only to estimate parameters.</html>
LogitCalibrationPanel.tooltip.mode=Enter the network's numeric mode ID; each mode may appear only once.
LogitCalibrationPanel.tooltip.observed=Choose this mode's observed OD quantities; a blank selection leaves the row unused.
LogitCalibrationPanel.tooltip.reference=Choose a mapped mode whose intercept is fixed at zero; other intercepts are relative to it.
LogitCalibrationPanel.tooltip.add=Add a mode and its observed OD table to the calibration.
LogitCalibrationPanel.tooltip.remove=Remove the selected mapping from this calibration; the OD table itself is not deleted.
ModalChoiceFormula.tooltip.logit=<html>A: available modes; C: cheapest admissible modal cost; r: reference mode.<br>V: systematic utility; alpha: modal intercept; beta: shared log-cost coefficient.<br>Coefficients are estimated separately for each commodity group.</html>
ModalChoiceFormula.tooltip.probit=<html>A: available modes; C: cheapest admissible modal cost; r: reference mode.<br>V: systematic utility; alpha: modal intercept; beta: shared log-cost coefficient.<br>Coefficients are estimated separately for each commodity group.<br>phi and Phi: standard-normal density and cumulative distribution.<br>Utility errors are independent N(0,1).</html>

ModalChoiceEstimationDlg.Specification=Model specification:
ModalChoiceEstimationDlg.SeeConsole=See the console for coverage details.
ModalChoiceEstimationDlg.LogToConsole=Log estimation details to console
ModalChoiceEstimationDlg.tooltip.logToConsole=<html>Print skipped OD records, coverage statistics \
    and estimated parameters in the console.<br>The estimation report is always saved in the cost \
    file after a successful fit.</html>
ModalChoiceEstimationDlg.Proportional=Proportional
LogitCalibrationPanel.tooltip.reference.proportional=Choose a mapped mode whose cost factor is fixed at one; other factors are relative to it.
ModalChoiceFormula.tooltip.proportional=<html>A: available modes; C: cheapest admissible modal cost; r: reference mode.<br>k: positive modal cost adjustment factor; the reference factor is one.<br>Factors are estimated separately for each commodity group.<br>The inverse-cost exponent is fixed at -1.</html>
ModalChoiceEstimationDlg.OutputCosts=Save cost functions as:
ModalChoiceEstimationDlg.tooltip.outputFile=<html>Name of the cost file to save in the project directory.<br>Keep the source name to update it, or enter another name to keep the source.<br>Replacing a different existing file requires confirmation.</html>
ModalChoiceEstimationDlg.InvalidOutputName=Enter a cost filename in the project directory.
ModalChoiceEstimationDlg.OverwriteOutput=The output cost file already exists. Replace it?
