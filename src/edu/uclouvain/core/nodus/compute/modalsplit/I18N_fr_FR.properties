ModalChoiceEstimationDlg.Proportional=Proportionnel
LogitCalibrationPanel.tooltip.reference.proportional=Choisir un mode dont le facteur de co\u00fbt est fix\u00e9 \u00e0 un ; les autres facteurs sont relatifs \u00e0 celui-ci.
ModalChoiceFormula.tooltip.proportional=<html>A : modes disponibles ; C : co\u00fbt modal admissible minimal ; r : mode de r\u00e9f\u00e9rence.<br>k : facteur positif d'ajustement du co\u00fbt modal ; le facteur de r\u00e9f\u00e9rence vaut un.<br>Les facteurs sont estim\u00e9s s\u00e9par\u00e9ment pour chaque groupe de marchandises.<br>L'exposant du co\u00fbt est fix\u00e9 \u00e0 -1.</html>
ModalChoiceEstimationDlg.OutputCosts=Enregistrer les fonctions de co\u00fbt sous :
ModalChoiceEstimationDlg.tooltip.outputFile=<html>Nom du fichier de co\u00fbts \u00e0 enregistrer dans le dossier du projet.<br>Garder le nom source pour le mettre \u00e0 jour, ou saisir un autre nom pour conserver la source.<br>Le remplacement d'un autre fichier existant demande confirmation.</html>
ModalChoiceEstimationDlg.InvalidOutputName=Saisir un nom de fichier de co\u00fbts dans le dossier du projet.
ModalChoiceEstimationDlg.OverwriteOutput=Le fichier de co\u00fbts de sortie existe d\u00e9j\u00e0. Le remplacer ?
