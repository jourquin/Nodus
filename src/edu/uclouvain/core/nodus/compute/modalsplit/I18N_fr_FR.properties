# Modal-choice dialog tooltips
ModalChoiceEstimationDlg.tooltip.method=Choisir le mod\u00e8le \u00e0 estimer : logit, probit ou facteurs de co\u00fbt proportionnels.
ModalChoiceEstimationDlg.tooltip.costFile=<html>Choisir le fichier existant fournissant les co\u00fbts de transport et la base du fichier de sortie.<br>Les d\u00e9finitions de base et par groupe/classe sont utilis\u00e9es ; les variantes de sc\u00e9nario sont ignor\u00e9es.</html>
ModalChoiceEstimationDlg.tooltip.routing=<html>Calculer les co\u00fbts modaux par le routage rapide de Dijkstra ou exact A-star.<br>Une recherche par mode/moyen, sans majoration des co\u00fbts.</html>
ModalChoiceEstimationDlg.tooltip.detour=<html>Longueur maximale d'un itin\u00e9raire, en multiple de celle de l'itin\u00e9raire de r\u00e9f\u00e9rence le moins cher.<br>La valeur 0 d\u00e9sactive cette limite.</html>
ModalChoiceEstimationDlg.tooltip.threads=<html>D\u00e9finir le nombre de t\u00e2ches parall\u00e8les pour le calcul des co\u00fbts des itin\u00e9raires.<br>L'estimation des param\u00e8tres est s\u00e9quentielle.</html>
ModalChoiceEstimationDlg.tooltip.cancel=Fermer la bo\u00eete de dialogue sans lancer l'estimation ni enregistrer les modifications.
ModalChoiceEstimationDlg.tooltip.estimate=<html>Calculer les co\u00fbts modaux, estimer les param\u00e8tres et les enregistrer dans le fichier de co\u00fbts de sortie.<br>L'affectation reste une op\u00e9ration distincte.</html>
LogitCalibrationPanel.tooltip.table=<html>Associer chaque num\u00e9ro de mode du r\u00e9seau \u00e0 sa table OD observ\u00e9e.<br>Les tables contiennent grp, org, dst et qty ; class est facultatif.<br>Ces observations servent uniquement \u00e0 estimer les param\u00e8tres.</html>
LogitCalibrationPanel.tooltip.mode=Saisir le num\u00e9ro du mode dans le r\u00e9seau ; chaque mode ne peut appara\u00eetre qu'une fois.
LogitCalibrationPanel.tooltip.observed=Choisir les quantit\u00e9s OD observ\u00e9es de ce mode ; une s\u00e9lection vide laisse la ligne inutilis\u00e9e.
LogitCalibrationPanel.tooltip.reference=Choisir un mode associ\u00e9 dont la constante est fix\u00e9e \u00e0 z\u00e9ro ; les autres constantes lui sont relatives.
LogitCalibrationPanel.tooltip.add=Ajouter un mode et sa table OD observ\u00e9e \u00e0 l'estimation.
LogitCalibrationPanel.tooltip.remove=Retirer l'association s\u00e9lectionn\u00e9e de cette estimation ; la table OD elle-m\u00eame n'est pas supprim\u00e9e.
ModalChoiceFormula.tooltip.logit=<html>A : modes disponibles ; C : co\u00fbt modal admissible minimal ; r : mode de r\u00e9f\u00e9rence.<br>V : utilit\u00e9 syst\u00e9matique ; alpha : constante modale ; beta : coefficient commun de log(co\u00fbt).<br>Les coefficients sont estim\u00e9s s\u00e9par\u00e9ment pour chaque groupe de marchandises.</html>
ModalChoiceFormula.tooltip.probit=<html>A : modes disponibles ; C : co\u00fbt modal admissible minimal ; r : mode de r\u00e9f\u00e9rence.<br>V : utilit\u00e9 syst\u00e9matique ; alpha : constante modale ; beta : coefficient commun de log(co\u00fbt).<br>Les coefficients sont estim\u00e9s s\u00e9par\u00e9ment pour chaque groupe de marchandises.<br>phi et Phi : densit\u00e9 et fonction de r\u00e9partition de la loi normale standard.<br>Les erreurs d'utilit\u00e9 sont ind\u00e9pendantes, de loi N(0,1).</html>

